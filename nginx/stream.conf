# TCP passthrough of the gateway's mTLS port for an external pipeline (profile "ci"). nginx does not terminate TLS: the
# gateway still verifies the client certificate against the internal CA, so only holders of a certificate it issued get in.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
stream {
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8443;
    set $gateway_mtls mcp-gateway.internal:8443;
    proxy_pass $gateway_mtls;
    proxy_connect_timeout 5s;
    proxy_timeout 120s;
  }
}
