# One origin for the portal, the gateway and the identity provider.
#   /auth/                                  -> keycloak (production mode, relative path /auth)
#   /api                                    -> portal (BFF)
#   /mcp, /s/, /.well-known/oauth-protected-resource*  -> gateway, public listener (8080) only
#   /                                       -> portal (single-page application)
#   /v/  -> 404 not_found_or_denied answered here (saved links are gone in 2.0)
# The gateway's admin API and JWKS live on its own mTLS listener (8443); this file has no route to it.
# Upstream names are resolved per request, so nginx starts and survives restarts of any upstream.
# The server blocks come from servers.conf.template (the container command fills in the domain and the ports).

worker_processes auto;
worker_rlimit_nofile 32768;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 8192; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Query strings carry authorization codes (OIDC and OAuth callbacks), so the log has the path only.
  log_format callbacks_safe '$remote_addr "$request_method $raw_path $server_protocol" $status $body_bytes_sent '
                            'rid=$http_x_request_id';
  access_log /dev/stdout callbacks_safe;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $request_uri $raw_path { ~^(?<p>[^?]*) $p; default $request_uri; }

  # Anything but a plain canonical path is refused instead of forwarded: encoded dots, slashes, backslashes and
  # percent signs, dot segments, doubled slashes. nginx forwards the request line as sent by the client when
  # proxy_pass has no URI part, so normalizing means rejecting what is not already normal. The identity provider
  # is exempt: its admin API and login pages use encoded characters legitimately.
  map $raw_path $noncanonical_path {
    ~^/auth(/|$) 0;
    ~*%(2e|2f|3b|5c|25|00) 1;
    ~\x5c 1;
    "~;" 1;
    ~(^|/)\.\.?(/|$) 1;
    ~// 1;
    default 0;
  }

  # Gateway routes carry server ids only (the filter of /mcp is in the query, which this map does not see): a percent
  # sign in the path is never legitimate (nginx would decode /%73/x to /s/x and hand the raw form to the gateway).
  map $uri $gateway_uri {
    ~^/s/ 1;
    ~^/mcp$ 1;
    ~^/v/ 1;
    ~^/\.well-known/oauth-protected-resource(/|$) 1;
    default 0;
  }
  map $raw_path $percent_in_path { ~% 1; default 0; }

  # The internal redirect to /_err/... runs the server rewrite phase again; the refusal must not fire a second
  # time, or nginx falls back to its own HTML page without our headers. $uri changes, so these are volatile.
  map $uri $error_page_uri { volatile; ~^/_err/ 1; default 0; }
  map "$error_page_uri:$noncanonical_path:$gateway_uri:$percent_in_path" $refuse_path {
    volatile;
    ~^0:1: 1;
    ~^0:0:1:1 1;
    default 0;
  }

  # $request is the raw request line, which exists even when the URI is rejected before parsing (bad escapes).
  map $request $gateway_route {
    ~^[A-Z]+\s/s/ 1;
    ~^[A-Z]+\s/v/ 1;
    ~^[A-Z]+\s/mcp([?\s]|$) 1;
    ~^[A-Z]+\s/\.well-known/oauth-protected-resource 1;
    default 0;
  }
  # The decoded URI counts too: /%73/x is a gateway route for nginx although the request line says otherwise.
  map "$gateway_route$gateway_uri" $error_dir { "00" web; default gw; }

  # Every login start of the portal opens a server session that lives 5 minutes until the login completes (mcp-portal
  # PORTAL_SESSION_LOGIN_TIMEOUT), and the BFF evicts the oldest of them when its session bound is reached. 60 per minute per
  # address keeps one address below about 330 of them, so a few addresses cannot push real users' login starts out. The callback
  # shares the zone: a login is two requests.
  limit_req_zone $binary_remote_addr zone=portal_login:1m rate=60r/m;

  include /tmp/servers.conf;
}
