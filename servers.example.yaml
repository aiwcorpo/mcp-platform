# One MCP server inside this Docker, as an example: the GitLab server. Copy this file to servers.yaml, change the names, and add it
# to .env:
#   COMPOSE_FILE=compose.yaml:servers.yaml
# The server speaks plain http on the "servers" network (MCP_PLAIN_HTTP): that network is internal and holds only the gateway, nginx and
# the servers. The administrator adds it in the portal as http://mcp-gitlab:8443/mcp with "allow plain http" (README, Add an MCP server).
# A server on another host is not part of this file: it runs from the deploy/ directory of its repository (README, MCP server on
# another host).
# This file shows the server of the mcp-server-gitlab image (serverId mcp-gitlab, system gitlab); its own deploy/ directory is the
# source of the settings. A server from another image has its own serverId and settings; the backend settings (MCP_GITLAB_*) are
# named after the system.

services:
  mcp-gitlab:
    image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-server-gitlab:${MCP_GITLAB_VERSION:-2.0.1@sha256:ba175943799fe6ed0cf59b7c3192006af9a59081ea531f5b0c433df7167a77f7}
    pull_policy: ${PULL_POLICY:-missing}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # cedar-java unpacks its native library at start.
    tmpfs: ["/tmp:exec"]
    mem_limit: ${MCP_GITLAB_MEM_LIMIT:-1g}
    environment:
      # The JVM trust store of the platform (public CAs, the internal CA, certs/company-ca.crt): the public keys of the gateway are
      # fetched from https://<domain>, which reaches nginx under its network alias and presents the certificate of certs/tls.crt.
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/trust/jvm-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
      MCP_PLAIN_HTTP: "true"
      MCP_GATEWAY_JWKS_URI: ${MCP_PUBLIC_ORIGIN:-https://${MCP_DOMAIN}}/.well-known/mcp-jwks.json
      MCP_CONNECT_URL: ${MCP_PUBLIC_ORIGIN:-https://${MCP_DOMAIN}}/connections?system={system}
      # A personal access token that the user enters in the portal; add user-oauth only with an OAuth client on the platform (README).
      MCP_ACCEPTED_CREDENTIAL_TYPES: user-secret
      # GitLab instance root, https, without /api/v4. MCP_GITLAB_ALLOW_PLAIN_HTTP=true is for tests only.
      MCP_GITLAB_URL: ${MCP_GITLAB_URL:?set MCP_GITLAB_URL in .env}
      MCP_GITLAB_ALLOW_PLAIN_HTTP: ${MCP_GITLAB_ALLOW_PLAIN_HTTP:-false}
    volumes:
      # Paging cursor key and the generated certificate (unused with plain http) stay between starts.
      - mcp-gitlab-state:/var/lib/mcp/state
      - type: volume
        source: secrets
        target: /certs/trust
        read_only: true
        volume: {subpath: pki/trust}
    networks:
      # The gateway calls the server by this name; egress is the way to the backend.
      servers:
        aliases: [mcp-gitlab]
      egress: {}
    healthcheck:
      # An open port is the signal: every path except /actuator/health needs a token, and the image has no HTTP client.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

volumes:
  mcp-gitlab-state:
