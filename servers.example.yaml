# One MCP server inside this Docker, as an example. Copy this file to servers.yaml, change the names, and add it to .env:
#   COMPOSE_FILE=compose.yaml:servers.yaml
# The server speaks plain http on the "servers" network (MCP_PLAIN_HTTP): that network is internal and holds only the gateway, nginx and
# the servers. The administrator adds it in the portal as http://mcp-example:8443/mcp with "allow plain http" (README, Add an MCP server).
# A server on another host is not part of this file: it runs from the deploy/ directory of its repository (README, MCP server on
# another host).
# This file shows the server of the mcp-server-example image (serverId mcp-example, system example). A server from another image
# has its own serverId and settings; the backend settings (MCP_EXAMPLE_*) are named after the system.

services:
  mcp-example:
    image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-server-example:${MCP_EXAMPLE_VERSION:-2.0.0}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # cedar-java unpacks its native library at start.
    tmpfs: ["/tmp:exec"]
    mem_limit: ${MCP_EXAMPLE_MEM_LIMIT:-1g}
    environment:
      # The JVM trust store of the platform (public CAs, the internal CA, certs/company-ca.crt): the public keys of the gateway are
      # fetched from https://<domain>, which reaches nginx under its network alias and presents the certificate of certs/tls.crt.
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/trust/jvm-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
      MCP_PLAIN_HTTP: "true"
      MCP_GATEWAY_JWKS_URI: ${MCP_PUBLIC_ORIGIN:-https://${MCP_DOMAIN}}/.well-known/mcp-jwks.json
      MCP_CONNECT_URL: ${MCP_PUBLIC_ORIGIN:-https://${MCP_DOMAIN}}/connections?system={system}
      MCP_ACCEPTED_CREDENTIAL_TYPES: user-secret
      # API of the backend system, https. Set both in .env for the stub backend below: plain http is for tests only.
      MCP_EXAMPLE_URL: ${MCP_EXAMPLE_URL:?set MCP_EXAMPLE_URL in .env}
      MCP_EXAMPLE_ALLOW_PLAIN_HTTP: ${MCP_EXAMPLE_ALLOW_PLAIN_HTTP:-false}
    volumes:
      # Paging cursor key and the generated certificate (unused with plain http) stay between starts.
      - mcp-example-state:/var/lib/mcp/state
      - type: volume
        source: secrets
        target: /certs/trust
        read_only: true
        volume: {subpath: pki/trust}
    networks:
      # The gateway calls the server by this name; egress is the way to the backend.
      servers:
        aliases: [mcp-example]
      egress: {}
    healthcheck:
      # An open port is the signal: every path except /actuator/health needs a token, and the image has no HTTP client.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # Test stack only (profile "stub"): the stub backend of mcp-e2e, built there as stub-backend/target/mcp-stub-backend.jar (make stub-test).
  # It accepts any credential and speaks plain http. Never on a production host.
  stub-backend:
    profiles: [stub]
    image: ${MCP_THIRD_PARTY_REGISTRY:-docker.io/library}/eclipse-temurin:25-jre@sha256:78f1f183913482ef390c2722f46c3f0ce76ada341d69590e7c482ec943ee72d5
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["java", "-jar", "/app/stub-backend.jar", "--bind", "0.0.0.0", "--port", "18081"]
    volumes:
      - ${MCP_STUB_BACKEND_JAR:-./mcp-stub-backend.jar}:/app/stub-backend.jar:ro
    networks: [servers]

volumes:
  mcp-example-state:
