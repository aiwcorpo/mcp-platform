{{- $ng := .Values.nginx -}}
{{- $sel := dict "root" . "component" "nginx" -}}
{{- $domain := required "global.publicDomain is required" .Values.global.publicDomain -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-platform.nginx" . }}
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  {{- /* The files are copies of nginx/ in the repository; only the upstream names differ (Service names of this release). */}}
  nginx.conf: |
    {{- .Files.Get "files/nginx/nginx.conf" | nindent 4 }}
  servers.conf.template: |
    {{- .Files.Get "files/nginx/servers.conf.template" | nindent 4 }}
  routes.conf: |
    {{- .Files.Get "files/nginx/routes.conf" | nindent 4 }}
  proxy-common.conf: |
    {{- .Files.Get "files/nginx/proxy-common.conf" | nindent 4 }}
  gateway-headers.conf: |
    {{- .Files.Get "files/nginx/gateway-headers.conf" | nindent 4 }}
  to-portal.conf: |
    {{- .Files.Get "files/nginx/to-portal.conf" | replace "http://portal:8080" (printf "http://%s:8080" (include "mcp-platform.portal" .)) | nindent 4 }}
  to-gateway.conf: |
    {{- .Files.Get "files/nginx/to-gateway.conf" | replace "http://gateway:8080" (printf "http://%s:8080" (include "mcp-platform.gateway" .)) | nindent 4 }}
  to-keycloak.conf: |
    {{- .Files.Get "files/nginx/to-keycloak.conf" | replace "http://keycloak:8080" (printf "http://%s:%d" (include "mcp-platform.keycloak" .) (int .Values.keycloak.httpPort)) | nindent 4 }}
  keycloak-admin-allow.conf: |
    {{- default (.Files.Get "files/nginx/keycloak-admin-allow.conf") $ng.keycloakAdminAllow | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "files/nginx/errors/*/*" }}
  {{ printf "err-%s-%s" (base (dir $path)) (base $path) }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
